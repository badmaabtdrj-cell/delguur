<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дэлгүүр</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/" id="logo">🛍️ <span id="shopName">Дэлгүүр</span></a>
    <input id="search" type="search" placeholder="Бараа хайх...">
    <nav class="account" id="account"></nav>
    <button class="cart-btn" data-action="open-cart" aria-label="Сагс">🛒 <b id="cartCount">0</b></button>
  </header>

  <main class="wrap">
    <!-- Дэлгүүр -->
    <section id="view-shop">
      <div class="banner">
        <h1>Шинэ бараа, хурдан хүргэлт</h1>
        <p id="deliveryInfo"></p>
      </div>
      <div class="filters">
        <div class="chips" id="categories"></div>
        <select id="sort">
          <option value="new">Шинэ нь эхэндээ</option>
          <option value="cheap">Хямд нь эхэндээ</option>
          <option value="expensive">Үнэтэй нь эхэндээ</option>
          <option value="sale">Хямдралтай</option>
        </select>
      </div>
      <p class="empty" id="empty" hidden>Тохирох бараа олдсонгүй.</p>
      <div class="grid" id="grid"></div>
    </section>

    <!-- Миний захиалга / Админ захиалга -->
    <section id="view-orders" hidden>
      <div class="view-head">
        <h1 id="ordersTitle">Миний захиалга</h1>
        <select id="statusFilter" hidden></select>
      </div>
      <div id="orderStats" class="stats" hidden></div>
      <div id="orders"></div>
    </section>
  </main>

  <!-- Сагс -->
  <aside class="drawer" id="cart" hidden>
    <div class="drawer-box">
      <div class="drawer-head">
        <h2>Сагс</h2>
        <button class="close" data-action="close-cart" aria-label="Хаах">×</button>
      </div>
      <div id="cartItems" class="cart-items"></div>
      <div id="cartFoot" class="cart-foot"></div>
    </div>
  </aside>

  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <button class="close" data-close aria-label="Хаах">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <footer class="foot">
    <p>© 2026 <span id="footName">Дэлгүүр</span></p>
    <p id="footPhone"></p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
